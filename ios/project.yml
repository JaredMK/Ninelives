name: ShouldaSaidSame
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
options:
  bundleIdPrefix: com.ninelives
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    # Signing is OFF for the simulator (nothing to sign against) and ON for a
    # real device, where DEVELOPMENT_TEAM comes from Local.xcconfig.
    CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: "NO"
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  # ── GameCore ──────────────────────────────────────────────────────────────
  # Pure-Swift engine + data layer. ZERO UIKit/SpriteKit imports (enforced by
  # GameCorePurityTests). The three data JSONs ride in this framework's bundle.
  GameCore:
    type: framework
    platform: iOS
    sources:
      - path: GameCore
      - path: Data
      - path: Resources
        buildPhase: resources
    info:
      path: App/GameCore-Info.plist
      properties:
        CFBundleName: GameCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ninelives.gamecore
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"
        BUILD_LIBRARY_FOR_DISTRIBUTION: "NO"
        # Map generation runs up to 240 build+validate attempts per stage, and
        # the cross-implementation suite generates hundreds of maps. Unoptimized
        # that is ~9 minutes of test time; -O brings it under one. Testability
        # stays on, so `@testable import GameCore` still works.
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        SWIFT_COMPILATION_MODE: wholemodule
        ENABLE_TESTABILITY: "YES"

  # ── The app ───────────────────────────────────────────────────────────────
  # Phase 2: the SpriteKit deal board + a debug launcher. Menus, map and store
  # are Phase 3.
  ShouldaSaidSame:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["GameCore-Info.plist", "Info.plist"]
      - path: Rendering
      - path: UI
      # VT323 + Press Start 2P, unwrapped from the web's .woff2 by
      # Tools/convert-fonts.py and registered through UIAppFonts below.
      - path: Assets
        buildPhase: resources
    dependencies:
      - target: GameCore
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Shoulda Said Same
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        # LAUNCH SCREEN (v6.52): the menu's OWN first frame — felt + tissue
        # atmosphere baked to LaunchBackdrop by the `-splashFrame 1` harness
        # flag — so the boot hold is visually continuous with the title splash
        # that follows (a bare UIColor hold read as a broken green screen on a
        # cold install). The JarHead Labs credit still lives inside the title
        # sequence (MainMenuViewController.runIntro), under the wordmark.
        # Dict form, NOT a storyboard: launch storyboards render BLACK on the
        # iOS 26 simulator runtime (observed v6.52; color-only reproduced it),
        # while this static form renders reliably. The image is centered at
        # intrinsic point size, so LaunchBackdrop is baked OVERSIZED (the
        # largest iPhone canvas) and center-crops on smaller devices; the
        # color fills any iPad letterbox with the same felt.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchBackdrop
          UIImageRespectsSafeAreaInsets: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities: [armv7]
        # XcodeGen flattens the Assets/ tree into the bundle root, so these are
        # bare filenames — NOT "Fonts/…". A wrong path here shows up as the
        # fail-loud assert in CRT.Font.of, not as a silent Helvetica swap.
        UIAppFonts:
          - VT323.ttf
          - PressStart2P.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ninelives.shouldasaidsame
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The app icon: App/Assets.xcassets/AppIcon.appiconset — every iPhone
        # and iPad size plus the 1024 marketing icon (13 PNGs). Regenerate the
        # whole set from Tools/render_icon.py, which owns the geometry.
        # The catalog rides the `App` source path above, so XcodeGen picks it
        # up on every regeneration without extra wiring.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # GAME CENTER (leaderboards). The entitlement rides this file, so an
        # `xcodegen generate` always preserves the capability. Needs a paid
        # Apple Developer account to sign for device/TestFlight; the simulator
        # skips code signing entirely (see CODE_SIGNING_ALLOWED above).
        CODE_SIGN_ENTITLEMENTS: App/ShouldaSaidSame.entitlements

  # ── UI tests ──────────────────────────────────────────────────────────────
  # Real-touch flows (the tutorial walk). Run via the ShouldaSaidSame scheme:
  #   xcodebuild test -scheme ShouldaSaidSame -only-testing:ShouldaSaidSameUITests
  ShouldaSaidSameUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ShouldaSaidSame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ninelives.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: ShouldaSaidSame

  # ── Tests ─────────────────────────────────────────────────────────────────
  # Logic-only bundle (no host app) so `xcodebuild test` runs fast.
  GameCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Fixtures
        buildPhase: resources
    dependencies:
      - target: GameCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ninelives.gamecoretests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  GameCore:
    build:
      targets:
        GameCore: all
        GameCoreTests: [test]
    test:
      targets: [GameCoreTests]
      gatherCoverageData: false
  ShouldaSaidSame:
    build:
      targets:
        ShouldaSaidSame: all
        GameCoreTests: [test]
        ShouldaSaidSameUITests: [test]
    run:
      config: Debug
    test:
      targets: [GameCoreTests, ShouldaSaidSameUITests]
