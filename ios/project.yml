name: ShouldaSaidSame
options:
  bundleIdPrefix: com.ninelives
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  # ── GameCore ──────────────────────────────────────────────────────────────
  # Pure-Swift engine + data layer. ZERO UIKit/SpriteKit imports (enforced by
  # GameCorePurityTests). The three data JSONs ride in this framework's bundle.
  GameCore:
    type: framework
    platform: iOS
    sources:
      - path: GameCore
      - path: Data
      - path: Resources
        buildPhase: resources
    info:
      path: App/GameCore-Info.plist
      properties:
        CFBundleName: GameCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ninelives.gamecore
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"
        BUILD_LIBRARY_FOR_DISTRIBUTION: "NO"
        # Map generation runs up to 240 build+validate attempts per stage, and
        # the cross-implementation suite generates hundreds of maps. Unoptimized
        # that is ~9 minutes of test time; -O brings it under one. Testability
        # stays on, so `@testable import GameCore` still works.
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        SWIFT_COMPILATION_MODE: wholemodule
        ENABLE_TESTABILITY: "YES"

  # ── The app ───────────────────────────────────────────────────────────────
  # Phase 1 renders NOTHING. Rendering/ and UI/ are deliberate empty stubs.
  ShouldaSaidSame:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["GameCore-Info.plist", "Info.plist"]
      # Phase 2 lives here. `buildPhase: none` keeps the stub notes visible in
      # the project navigator without copying them into the app bundle.
      - path: Rendering
        buildPhase: none
      - path: UI
        buildPhase: none
    dependencies:
      - target: GameCore
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Shoulda Said Same
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities: [armv7]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ninelives.shouldasaidsame
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"

  # ── Tests ─────────────────────────────────────────────────────────────────
  # Logic-only bundle (no host app) so `xcodebuild test` runs fast.
  GameCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Fixtures
        buildPhase: resources
    dependencies:
      - target: GameCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ninelives.gamecoretests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  GameCore:
    build:
      targets:
        GameCore: all
        GameCoreTests: [test]
    test:
      targets: [GameCoreTests]
      gatherCoverageData: false
  ShouldaSaidSame:
    build:
      targets:
        ShouldaSaidSame: all
        GameCoreTests: [test]
    run:
      config: Debug
    test:
      targets: [GameCoreTests]
