name: Deploy to GitHub Pages

# Publishes the static site to GitHub Pages as ONE Pages site with two paths:
#   /            -> the LIVE game  (branch claude/mobile-card-game-prototype-86Yx7)
#   /neural/     -> the neural redesign (branch neural-redesign)
#
# The site ROOT is ALWAYS rebuilt from the live branch, regardless of which
# branch triggered the run, so the neural branch can never change what the live
# URL serves — it only ever populates /neural/. (Pages keeps the last good
# deploy if a run fails, so a broken preview can never take the live game down.)
on:
  push:
    branches:
      - claude/mobile-card-game-prototype-86Yx7   # live  -> root
      - neural-redesign                            # redesign -> /neural (root re-sourced from live)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Site ROOT = the live game. Pinned to the live branch so the live URL is
      # never affected by whatever triggered this run.
      - name: Checkout LIVE (site root)
        uses: actions/checkout@v4
        with:
          ref: claude/mobile-card-game-prototype-86Yx7
          path: live

      # /neural/ = the neural-redesign branch. Non-fatal: a live deploy must
      # never be blocked by a problem fetching the preview.
      - name: Checkout REDESIGN (/neural)
        id: redesign
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: neural-redesign
          path: redesign

      - name: Assemble site (live at root, neural redesign under /neural)
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' live/ _site/
          if [ -f redesign/index.html ]; then
            mkdir -p _site/neural
            rsync -a --exclude='.git' redesign/ _site/neural/
            echo "Assembled: root = live, /neural = neural-redesign"
          else
            echo "Redesign checkout unavailable — deploying live only."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages deployments occasionally sit in GitHub's queue well past the
          # action's 10-minute default (two consecutive runs died that way on
          # 2026-07-02); give an attempt 30 minutes to outlast a backlog.
          timeout: 1800000
